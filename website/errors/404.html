<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | page not found</title>
</head>
<body>
    <header>
        <h1>
            404 | Page not found
        </h1>
    </header>
    <main>
        <div id="text">
            <h3>
                Andere Seiten:
            </h3>
        </div>
        <div id="sites">

        </div>
    </main>
</body>
<style>
    body {
        background-color: black;
        color: white;
        padding: 0;
        margin: 0;
        border: 2px solid white;
        border-radius: 10px 10px 10px 10px;
        min-height: 600px;
        max-height: 800px;
    }
    header {
        text-align: center;
        font-size: larger;
    }
    .sites {
        display: flex;
        width: 100%;
        flex-wrap: wrap;
        text-align: center;
        flex-direction: column;
        justify-content: center;
    }
    .site {
        font-size: larger;
        padding: 10px;
        text-align: center;
        background-color: black;
        color: white;
        border: 2px solid white;
        border-radius: 10px 10px 10px 10px;
        margin: 30px;
    }
    .site:hover {
        cursor: pointer;
    }
</style>
<script>
    fetch('/api/routes').then( async(res) => {
        let times = 0
        for (const route of await res.json()) {
            const button = document.createElement("BUTTON")
            button.id = 'sites-' + (++times)
            button.className = "site"
            button.innerHTML = route
            button.onclick = `window.location = "${route}"`
            button.setAttribute('onclick', `window.location = "${route}"`)
            document.getElementById("sites").appendChild(button)
        }
    })
</script>
</html>
